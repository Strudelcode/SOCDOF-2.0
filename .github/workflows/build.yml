# CI trigger marker: keep this workflow rerunnable from a normal main-branch push.
name: Build SOCDOF Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release

      - name: Publish self-contained single-file executable
        run: dotnet publish SOCDOF.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOCDOF-Windows-Executable
          path: ./publish
          if-no-files-found: error

      - name: Determine release channel
        if: startsWith(github.ref, 'refs/tags/')
        id: release-type
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match '^v[0-9]+\.0\.0$') {
            "prerelease=false" >> $env:GITHUB_OUTPUT
          } else {
            "prerelease=true" >> $env:GITHUB_OUTPUT
          }

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/SOCDOF.exe
          body_path: versions/releases/v2-release.md
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          generate_release_notes: false
