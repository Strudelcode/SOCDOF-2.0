name: Build SOCDOF Windows

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release

      - name: Publish self-contained single-file executable
        run: dotnet publish SOCDOF.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SOCDOF-Windows-Executable
          path: ./publish
          if-no-files-found: error
