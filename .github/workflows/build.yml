name: Build SOCDOF Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: socdof-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Determine application version
        id: version
        shell: pwsh
        run: |
          $appConfig = Get-Content -Raw -LiteralPath 'AppConfig.cs'
          $m = [regex]::Match($appConfig, 'Version\s*=\s*"v(?<version>[0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $m.Success) { throw 'Could not read semantic version from AppConfig.cs.' }
          $version = $m.Groups['version'].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne '${{ steps.version.outputs.tag }}') { throw "Tag ${{ github.ref_name }} does not match AppConfig version ${{ steps.version.outputs.tag }}." }
      - name: Restore
        run: dotnet restore SOCDOF.csproj
      - name: Publish Windows executable
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish SOCDOF.csproj -c Release -r win-x64 --self-contained true --no-restore /p:PublishSingleFile=true /p:Version=$env:VERSION /p:FileVersion="$env:VERSION.0" /p:AssemblyVersion="$env:VERSION.0" /p:InformationalVersion="$env:VERSION+${{ github.sha }}" -o ./publish
          $exe = Join-Path $PWD 'publish\SOCDOF_2.0.exe'
          if (-not (Test-Path $exe)) { throw "Missing published executable: $exe" }
          [System.IO.File]::SetLastWriteTimeUtc($exe, [DateTime]::UtcNow)
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build setup installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        working-directory: installer
        env:
          SOCDOF_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc 'SOCDOF.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
      - name: Validate setup installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (-not (Test-Path './installer-output/SOCDOF_setup.exe')) { throw 'SOCDOF_setup.exe was not produced.' }
      - name: Upload setup artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: SOCDOF-Setup-Installer
          path: ./installer-output/SOCDOF_setup.exe
          if-no-files-found: error
      - name: Determine release metadata
        if: startsWith(github.ref, 'refs/tags/')
        id: release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $major = [regex]::Match($tag, '^v[0-9]+').Value
          $primary = "versions/releases/${major}-release.md"
          $fallback = "versions/${major.ToUpperInvariant()}.md"
          if (Test-Path $primary) { $notes = $primary } elseif (Test-Path $fallback) { $notes = $fallback } else { throw "No release notes found for $tag." }
          $pre = if ($tag -match '^v[0-9]+\.0\.0$') { 'false' } else { 'true' }
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ./installer-output/SOCDOF_setup.exe
          body_path: ${{ steps.release.outputs.notes }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: false
      - name: Create version tag from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          CURRENT_COMMIT: ${{ github.sha }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git fetch origin "refs/tags/$tag:refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists. No tag update will be attempted."
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag $tag $env:CURRENT_COMMIT
          git push origin $tag
          Write-Host "Created tag $tag; tag push will start the release build."
